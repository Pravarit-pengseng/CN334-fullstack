name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    # กำหนดให้ทุก step ทำงานในโฟลเดอร์ของโปรเจกต์ (Monorepo setup)
    defaults:
      run:
        working-directory: ./apps/your-app-name # <-- *** เปลี่ยนตรงนี้ให้เป็น path ของคุณ ***

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: lts/*

        cache: 'npm'
        cache-dependency-path: './cn334-frontend/package-lock.json' # <-- *** เปลี่ยนตรงนี้ด้วย ***

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright tests
      env:
         NEXT_PUBLIC_API_URL: http://localhost:3000
      run: npx playwright test

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        # ตรง path ของ artifact ต้องระบุให้ถูกต้องตามโครงสร้างโฟลเดอร์
        path: ./cn334-frontend/playwright-report/ 
        retention-days: 30
